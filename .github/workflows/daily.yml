name: Daily pow report
on:
  schedule:
    - cron: "40 13 * * *"
    - cron: "40 21 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update data and build page
        run: python update.py
      - name: Save latest data
        run: |
          git config user.name "pow-bot"
          git config user.email "pow-bot@users.noreply.github.com"
          git add data.json
          git commit -m "Daily data update" || echo "no changes"
          git push || echo "push skipped"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
